name: Ship

# Builds everything a user can download or run:
# - a multi-arch (amd64, arm64) server image on ghcr.io
# - standalone agent-auth executables for Linux, macOS and Windows
# - the npm package tarball of the SDK and CLI
# - SPDX SBOMs for the source tree and the image, build provenance attestations for every asset and
#   the image, and a cosign keyless signature on the image
# A pushed v* tag publishes a GitHub Release with these assets and SHA256SUMS, then publishes the
# package to npm as @superintelligenceco/agent-auth with provenance.
# A manual run uploads the same files as workflow artifacts and pushes :edge and :sha-<commit> images.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2
  IMAGE: ghcr.io/${{ github.repository }}
  SMOKE_ADMIN_TOKEN: ship-smoke-admin-token-0123456789

jobs:
  sdk:
    name: npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          npm pack --pack-destination out
          # Release assets share the agent-auth- prefix, so rename the scoped tarball.
          mv "out/superintelligenceco-agent-auth-$VERSION.tgz" "out/agent-auth-$VERSION.tgz"
      - name: Smoke test the tarball
        run: |
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/out/agent-auth-*.tgz
          node -e 'import("@superintelligenceco/agent-auth").then((m) => { if (!m.AgentAuthClient) process.exit(1) })'
          npx agent-auth --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk
          path: out/
          if-no-files-found: error

  binaries:
    name: Standalone executables
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci --ignore-scripts
      - name: Compile
        env:
          VERSION: ${{ needs.sdk.outputs.version }}
        run: scripts/build-binaries.sh "$VERSION" out
      - name: Smoke test linux-x64
        env:
          AGENT_AUTH_ADMIN_TOKEN: ${{ env.SMOKE_ADMIN_TOKEN }}
        run: |
          out/agent-auth-linux-x64 --version
          out/agent-auth-linux-x64 serve --port 8787 --db "$RUNNER_TEMP/db.sqlite" --key "$RUNNER_TEMP/key.pem" &
          scripts/smoke.sh http://127.0.0.1:8787
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: out/
          if-no-files-found: error

  verify-binaries:
    name: Run on ${{ matrix.os }}
    needs: binaries
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: agent-auth-macos-arm64
          - os: windows-latest
            binary: agent-auth-windows-x64.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: out
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
          sparse-checkout: scripts
      - name: Smoke test
        env:
          AGENT_AUTH_ADMIN_TOKEN: ${{ env.SMOKE_ADMIN_TOKEN }}
          BINARY: out/${{ matrix.binary }}
        run: |
          chmod +x "$BINARY"
          "$BINARY" --version
          "$BINARY" serve --port 8787 --db "$RUNNER_TEMP/db.sqlite" --key "$RUNNER_TEMP/key.pem" &
          src/scripts/smoke.sh http://127.0.0.1:8787

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Smoke test the pushed image
        env:
          AGENT_AUTH_ADMIN_TOKEN: ${{ env.SMOKE_ADMIN_TOKEN }}
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name agent-auth -p 127.0.0.1:8787:8787 \
            -e AGENT_AUTH_ADMIN_TOKEN "$REF"
          scripts/smoke.sh http://127.0.0.1:8787 || { docker logs agent-auth; exit 1; }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom/agent-auth-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image
          path: sbom/
          if-no-files-found: error
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Container image"
            echo "Digest: \`$DIGEST\`"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan image
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      REF: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REF }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REF }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  assets:
    name: Release assets
    needs: [sdk, binaries, verify-binaries, image, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/agent-auth-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - run: mv "$RUNNER_TEMP/agent-auth-source.spdx.json" assets/
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/agent-auth-*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.sdk.outputs.version }}
        run: |
          # Release notes are the CHANGELOG section for this version.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber assets/*

  npm:
    name: Publish to npm
    if: github.ref_type == 'tag'
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  install:
    name: install.sh on ${{ matrix.os }}
    if: github.ref_type == 'tag'
    needs: assets
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release with install.sh
        env:
          AGENT_AUTH_VERSION: ${{ github.ref_name }}
          AGENT_AUTH_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh install.sh
          test "v$("$AGENT_AUTH_INSTALL_DIR/agent-auth" --version)" = "$AGENT_AUTH_VERSION"
