name: Feature request
description: Suggest a change to the scope grammar, the API, the CLI or the SDK.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why can't you do it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: If this changes the scope grammar, show example scopes and requests.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Could this let an attenuated token gain authority its parent lacks? How does it interact with revocation and audit?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
