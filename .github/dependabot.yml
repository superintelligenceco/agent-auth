version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 13 requires Node 22 or later; the package supports Node 20.
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
      # 5 makes npm crash while resolving the peer set with the current toolchain.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    ignore:
      # 12.0.0 pulls in a lodash-es release with known high-severity advisories.
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
    groups:
      docs-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: docs
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # Node 26 is not an LTS release yet; the image stays on the LTS line.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
